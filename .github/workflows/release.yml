name: build-installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # кнопка "Run workflow": собрать без публикации

permissions:
  contents: write             # нужно, чтобы создать релиз и залить в него файл

jobs:
  build:
    runs-on: windows-latest
    env:
      # UTF-8 mode: чтобы pip/PyInstaller/наши скрипты читали UTF-8-файлы (requirements,
      # version_info.txt) при локали cp1252 на раннере, а не падали на не-ASCII байтах.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2      # пин: воспроизводимая сборка

      - name: Определить версию
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' -replace '^v', '' } else { '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Записать версию в единственный источник
        run: python tools/set_version.py ${{ steps.ver.outputs.version }}

      - name: Собрать .exe
        run: python -m PyInstaller --noconfirm --clean --log-level WARN Pinion.spec

      - name: Смоук — реальный прогон ЯДРА в собранном .exe
        shell: pwsh
        run: |
          # --selftest-core проходит реальный путь ядра (импорт core+letter_score, рендер,
          # сборка письма, скоринг) БЕЗ GUI-бэкенда (webview/clr): на безголовом раннере
          # инициализация .NET-GUI через pythonnet падает/крашится, хотя на реальном рабочем
          # столе всё работает (упаковка GUI доказана локальным install+run). Без console у
          # сборки stdout=None, поэтому selftest пишет отчёт в файл.
          # ВАЖНО: .exe оконный (console=False). Оператор & в PowerShell НЕ ждёт оконный
          # процесс — запускаем через Start-Process -Wait и берём реальный код возврата.
          $exe = "dist\Pinion\Pinion.exe"
          if (-not (Test-Path $exe)) { throw "нет $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest-core","selftest.log" -Wait -PassThru
          if (-not (Test-Path selftest.log)) { throw "selftest не создал лог (код $($p.ExitCode))" }
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "selftest вернул $($p.ExitCode)" }
          $log = Get-Content selftest.log -Raw
          if ($log -notmatch 'SELFTEST_OK') { throw "нет токена SELFTEST_OK" }

      - name: Проверить версию в ресурсе .exe
        shell: pwsh
        run: |
          $vi = (Get-Item "dist\Pinion\Pinion.exe").VersionInfo.FileVersion
          $want = "${{ steps.ver.outputs.version }}"
          if ($vi -ne $want) { throw "версия в .exe '$vi' != тега '$want'" }
          "exe FileVersion=$vi"

      - name: Собрать установщик
        shell: pwsh
        run: |
          # На windows-latest Inno Setup обычно уже стоит; если образ сменится и его не
          # окажется — ставим сами, чтобы workflow не развалился молча.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" Pinion.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Проверить установщик
        shell: pwsh
        run: |
          $f = "installer\Pinion-setup.exe"
          if (-not (Test-Path $f)) { throw "нет файла $f" }
          $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
          "installer = $mb MB"
          if ($mb -lt 15) { throw "установщик подозрительно мал: $mb MB" }

      - uses: actions/upload-artifact@v4
        with:
          name: Pinion-setup
          path: installer/Pinion-setup.exe

      - name: Опубликовать релиз
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Pinion ${{ steps.ver.outputs.version }}
          files: installer/Pinion-setup.exe
          body: |
            **Windows 10/11, 64-bit.** Скачайте `Pinion-setup.exe` ниже и запустите —
            Python и все библиотеки внутри, ставить отдельно ничего не нужно.

            При первом запуске Windows покажет синий экран «Windows защитила ваш
            компьютер». Это ожидаемо для любого установщика без платной цифровой
            подписи: нажмите **Подробнее** → **Выполнить в любом случае**.

            Программа устанавливается в профиль пользователя, права администратора
            не требуются.
